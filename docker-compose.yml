services:
  redis:
    image: redis:7-alpine
    container_name: comunity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - comunity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase CLI owns local Auth, Postgres/PostGIS, and Mailpit. This compose
  # file intentionally retains only the application-owned Redis dependency.

  # Frontend service (uncomment when ready)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: comunity-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   environment:
  #     REACT_APP_API_URL: http://localhost:5000
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
  #     - comunity-network
  #   command: npm run dev

volumes:
  redis_data:

networks:
  comunity-network:
    driver: bridge
