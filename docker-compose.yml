services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: comunity-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desarrollo123}
      POSTGRES_DB: ${POSTGRES_DB:-comunity_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - comunity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comunity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - comunity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Docker is intentionally limited to local development dependencies.
  # The FastAPI backend runs from backend/.venv locally and deploys to Railway
  # with Supabase as the hosted database.

  # Frontend service (uncomment when ready)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: comunity-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   environment:
  #     REACT_APP_API_URL: http://localhost:5000
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
  #     - comunity-network
  #   command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  comunity-network:
    driver: bridge
