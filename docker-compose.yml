version: '3.8'

services:
  postgres:
    image: postgis/postgis:latest
    container_name: comunity-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desarrollo123}
      POSTGRES_DB: ${POSTGRES_DB:-comunity_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - comunity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comunity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - comunity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

